<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jemini – Pending Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #c4b5f4;
      --card-bg: #ede8fb;
      --card-border: #d4c9f5;
      --text-dark: #1a1a2e;
      --text-label: #3d3560;
      --text-muted: #7b6ea8;
      --accent: #6c47d4;
      --shadow: 0 4px 16px rgba(108, 71, 212, 0.12);
      --shadow-hover: 0 8px 24px rgba(108, 71, 212, 0.22);
      --radius: 16px;
    }

    body {
      background: #b8a8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Nunito Sans', sans-serif;
      padding: 24px 16px;
    }

    .phone-frame {
      width: 390px;
      min-height: 820px;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(80, 40, 180, 0.28), 0 2px 8px rgba(0,0,0,0.1);
      padding: 0 0 32px 0;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 28px 24px 20px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .welcome-section h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--text-dark);
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .welcome-section h1 span {
      color: var(--accent);
    }

    .bell-icon {
      stroke: var(--text-dark);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 20px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.35);
    }

    .page-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 24px;
      color: var(--accent);
      letter-spacing: -0.3px;
      flex: 1;
      text-align: center;
      padding-right: 36px; /* offset for back btn to keep centering */
    }

    /* Orders List */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 20px;
    }

    .order-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 14px 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
      box-shadow: var(--shadow);
      animation: cardFadeIn 0.45s ease both;
    }

    .order-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: var(--shadow-hover);
      background: #f3eefd;
    }

    .order-card:active {
      transform: scale(0.98);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .order-card:nth-child(1) { animation-delay: 0.05s; }
    .order-card:nth-child(2) { animation-delay: 0.10s; }
    .order-card:nth-child(3) { animation-delay: 0.15s; }
    .order-card:nth-child(4) { animation-delay: 0.20s; }
    .order-card:nth-child(5) { animation-delay: 0.25s; }

    /* Thumbnail placeholder */
    .order-thumb {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, #d6caf7, #c4b5f4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .order-thumb svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.6;
    }

    .order-info {
      flex: 1;
    }

    .order-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-dark);
      letter-spacing: -0.1px;
    }

    .order-due {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .order-menu {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 4px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .order-menu:hover {
      background: rgba(108, 71, 212, 0.08);
    }
    .order-menu span {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    svg { display: block; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- Top Bar (darker lavender background) -->
  <div style="background: #9f85e0; padding-bottom: 0;">
    <div class="top-bar" style="padding-bottom: 16px;">

    <div class="order-card">
      <div class="order-thumb">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="order-info">
        <div class="order-name">Estein – Cookies</div>
        <div class="order-due">Must be done : April 22</div>
      </div>
      <div class="order-menu"><span></span><span></span><span></span></div>
    </div>

    <div class="order-card">
      <div class="order-thumb">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="order-info">
        <div class="order-name">Obama – Custom Bouquet</div>
        <div class="order-due">Must be done : April 22</div>
      </div>
      <div class="order-menu"><span></span><span></span><span></span></div>
    </div>

    <div class="order-card">
      <div class="order-thumb">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="order-info">
        <div class="order-name">Ginger – Cookies</div>
        <div class="order-due">Must be done : April 25</div>
      </div>
      <div class="order-menu"><span></span><span></span><span></span></div>
    </div>

    <div class="order-card">
      <div class="order-thumb">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="order-info">
        <div class="order-name">Taylor – Crafts</div>
        <div class="order-due">Must be done : April 28</div>
      </div>
      <div class="order-menu"><span></span><span></span><span></span></div>
    </div>

  </div>

</div>

</body>
</html>
