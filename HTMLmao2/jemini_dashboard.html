<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jemini Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #c4b5f4;
      --card-bg: #ede8fb;
      --card-border: #d4c9f5;
      --text-dark: #1a1a2e;
      --text-label: #3d3560;
      --accent: #6c47d4;
      --shadow: 0 4px 16px rgba(108, 71, 212, 0.12);
      --shadow-hover: 0 8px 24px rgba(108, 71, 212, 0.22);
      --radius: 16px;
    }

    body {
      background: #b8a8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Nunito Sans', sans-serif;
      padding: 24px 16px;
    }

    .phone-frame {
      width: 390px;
      min-height: 820px;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(80, 40, 180, 0.28), 0 2px 8px rgba(0,0,0,0.1);
      padding: 0 0 32px 0;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 28px 24px 20px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-chip {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c5ce8, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 11px;
      color: white;
      letter-spacing: -0.3px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(108, 71, 212, 0.3);
    }

    .logo-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    /* Welcome */
    .welcome-section {
      padding: 0;
    }

    .welcome-section h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--text-dark);
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .welcome-section h1 span {
      color: var(--accent);
    }

    /* Section Label */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px 16px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1.5px;
      background: linear-gradient(to right, var(--accent), transparent);
      opacity: 0.3;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      animation: cardFadeIn 0.5s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(108, 71, 212, 0.06);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-hover);
      background: #f3eefd;
    }

    .card:active {
      transform: scale(0.98);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.10s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.20s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(6) { animation-delay: 0.30s; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(108, 71, 212, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-value {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 32px;
      color: var(--text-dark);
      line-height: 1;
      letter-spacing: -1px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-label {
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: var(--text-label);
      letter-spacing: 0.2px;
    }

    /* Badge dot for active cards */
    .card.has-badge .card-icon::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 14px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6c47d4;
      border: 2px solid var(--card-bg);
    }

    /* SVG Icons */
    svg { display: block; }

    /* Gear icon */
    .gear-icon { stroke: var(--text-dark); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bell-icon { stroke: var(--text-dark); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="welcome-section">
      <h1>Welcome back<br><span>Jemini</span></h1>
    </div>
    <div class="icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" class="bell-icon">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
  </div>

  <!-- Section -->
  <div class="section-label">Main</div>

  <!-- Cards Grid -->
  <div class="grid">

    <!-- Pending Orders -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="card-value">67</div>
      </div>
      <div class="card-footer">
        <div class="card-label">Pending Orders</div>
      </div>
    </div>

    <!-- Asset Stocks -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="card-value">69%</div>
      </div>
      <div class="card-footer">
        <div class="card-label">Asset Stocks</div>
      </div>
    </div>

    <!-- Customer Service -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="card-value">13</div>
      </div>
      <div class="card-footer">
        <div class="card-label">Customer Service</div>
      </div>
    </div>

    <!-- Active Users -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="card-value">03</div>
      </div>
      <div class="card-footer">
        <div class="card-label">Active Users</div>
      </div>
    </div>

    <!-- Sales History -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
      </div>
      <div class="card-footer">
        <div class="card-label">Sales History</div>
      </div>
    </div>

    <!-- Payments -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="13" width="20" height="6" rx="1.5"/>
            <circle cx="12" cy="16" r="1.5"/>
            <line x1="5" y1="16" x2="5.01" y2="16" stroke-width="2.5"/>
            <line x1="19" y1="16" x2="19.01" y2="16" stroke-width="2.5"/>
            <rect x="2" y="9.5" width="20" height="5" rx="1.5"/>
            <rect x="2" y="6" width="20" height="5" rx="1.5"/>
            <circle cx="12" cy="8.5" r="1.5"/>
            <line x1="5" y1="8.5" x2="5.01" y2="8.5" stroke-width="2.5"/>
            <line x1="19" y1="8.5" x2="19.01" y2="8.5" stroke-width="2.5"/>
          </svg>
        </div>
      </div>
      <div class="card-footer">
        <div class="card-label">Payments</div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
