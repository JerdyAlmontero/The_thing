<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jemini – Active Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #c4b5f4;
      --card-bg: #ede8fb;
      --card-border: #d4c9f5;
      --text-dark: #1a1a2e;
      --text-label: #3d3560;
      --text-muted: #7b6ea8;
      --accent: #6c47d4;
      --shadow: 0 4px 16px rgba(108, 71, 212, 0.12);
      --shadow-hover: 0 8px 24px rgba(108, 71, 212, 0.22);
      --radius: 16px;
    }

    body {
      background: #b8a8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Nunito Sans', sans-serif;
      padding: 24px 16px;
    }

    .phone-frame {
      width: 390px;
      min-height: 820px;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(80, 40, 180, 0.28), 0 2px 8px rgba(0,0,0,0.1);
      padding: 0 0 32px 0;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 28px 24px 16px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.3); }

    .welcome-section h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--text-dark);
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
    .welcome-section h1 span { color: var(--accent); }

    .bell-icon {
      stroke: var(--text-dark);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 16px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .page-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 24px;
      color: var(--accent);
      letter-spacing: -0.3px;
      flex: 1;
      text-align: center;
      padding-right: 36px;
    }

    /* Users List */
    .users-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px;
    }

    .user-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 18px 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
      box-shadow: var(--shadow);
      animation: cardFadeIn 0.45s ease both;
    }

    .user-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: var(--shadow-hover);
      background: #f3eefd;
    }

    .user-card:active { transform: scale(0.98); }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .user-card:nth-child(1) { animation-delay: 0.04s; }
    .user-card:nth-child(2) { animation-delay: 0.08s; }
    .user-card:nth-child(3) { animation-delay: 0.12s; }
    .user-card:nth-child(4) { animation-delay: 0.16s; }
    .user-card:nth-child(5) { animation-delay: 0.20s; }

    /* Avatar */
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #d6caf7, #c4b5f4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-dark);
      letter-spacing: -0.1px;
    }

    svg { display: block; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- Top Bar (darker lavender background) -->
  <div style="background: #9f85e0; padding-bottom: 0;">
    <div class="top-bar">
      <div class="welcome-section">
        <h1>Welcome back<br><span>Jemini</span></h1>
      </div>
      <div class="icon-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" class="bell-icon">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="page-title">Active Users</div>
  </div>

  <!-- Users List -->
  <div class="users-list">

    <div class="user-card">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6c47d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-name">Travis</div>
    </div>

    <div class="user-card">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6c47d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-name">Estein</div>
    </div>

    <div class="user-card">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6c47d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-name">Obama</div>
    </div>

    <div class="user-card">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6c47d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-name">Ginger</div>
    </div>

    <div class="user-card">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#6c47d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-name">Taylor</div>
    </div>

  </div>

</div>

</body>
</html>
